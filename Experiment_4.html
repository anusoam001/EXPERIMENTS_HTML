<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body> 
    <h1 align="center"><b>Hotel Room Booking FORM</b></h1>
    <fieldset>
    <form action="#" align="center">
    <lable for="name">Full Name:</lable>
    <input type="text" name="name" id="name">
    <br><br>
    <lable for="email">Email:</lable>
    <input type="email" name="email" id="email">
    <br><br>
    <lable for="tel">Phone:</lable>
    <input type="tel" name="tel" id="name">
    <br><br>
    <lable for="dob">Check-in-date:</lable>
    <input type="date" name="dob" id="dob">
    <br><br>
    <lable for="dob">Check-out-date:</lable>
    <input type="date" name="dob" id="dob">
    <br><br>
    
    <lable for="lang">Room Type:</lable>
    <select name="lang" id="lang">
        <option value="select">Select</option>
        <option value="select">Single Room</option>
        <option value="select">Double Room</option>
    </select>
    <br><br>
    <lable type="number">Number of Guests:</lable>
    <input type="number" name="number" id="number">
    <br><br>
    <lable type="requests">Special Requests:</lable>
    <br>
    <textarea name="text" id="text"></textarea>
        <br><br>       
        <input type ="submit" value="BOOK Now">
        <input type="Reset" value="Reset Form">
    

    </form>
</fieldset>
    
</body>
</html>
