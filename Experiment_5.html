<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1 align="center"><b>Student Registration Form</b></h1>
    <fieldset>
    <form action="#"
    <label for="name">Full Name:</label>
    <input type="text" name="name" id="name" placeholder="Enter your full name">
    <br><br>
    <lable for="email">Email:</lable>
    <input type="email" name="email" id="email" placeholder="Enter valid email address">
    <br><br>
    <lable for="pass">Password:</lable>
    <input type="Password" name="pass" id="pass" placeholder="Enter password"
    >
    <br><br>
    <lable for="gender">Gender:</lable>
    <input type="radio" name="gender" id="gender">
    <lable for="gender">Male</lable>
    <input type="radio" name="gender" id="gender">
    <lable for="gender">Female</lable>
    <input type="radio" name="gender" id="gender">
    <lable type="gender">Other</lable>
    <br><br>
    <lable for="lang">Course:</lable>
    <select name="lang" id="lang">
    <option type="select">Select Course</option>
    <option value="select">B.tech</option>
    <option value="select">BBA</option>
    <option value="select">BCA</option>
    <option value="select">BA</option>
    </select>
    <br><br>
    <label type="tel">Contact NO:</label>
    <input type="tel" name="tel" id="tel" placeholder="Enter phone number">
    <br><br>
    <label type="add">Address:</label>
    <br>
    <textarea name="add" id="add" placeholder="Enter your address"></textarea>
    <br><br>
    <input type="submit" value="Register">
    <input type="reset" value="Clear">

    
    </form>
    </fieldset> 
</body>
</html>
